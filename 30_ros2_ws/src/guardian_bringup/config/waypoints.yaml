# GUARDIAN demo mission waypoints — map frame, x/y in meters, yaw in radians.
# Consumed in order by demo_mission_node. Edit by hand, or record one live:
# drive the robot to the spot, then run `set_waypoint <index>` (see
# guardiam_env.sh) to overwrite that entry with the robot's current
# map->base_link pose. set_waypoint_node rewrites this whole file when it
# does that, so hand-added comments below the `waypoints:` key won't survive.
waypoints:
  - {x: 3.0, y: 0.0, yaw: 0.0}
  - {x: 0.0, y: 0.0, yaw: 0.0}
