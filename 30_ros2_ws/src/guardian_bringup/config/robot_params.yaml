serial_bridge_node:
  ros__parameters:
    serial_port_left: /dev/ttyACM0
    serial_port_right: /dev/ttyACM1
    baud_rate: 115200
    serial_timeout: 1.0
    # wheel_radius/wheel_base_length/wheel_base_width feed this node's own
    # encoder-tick -> odometry math (_compute_odom), separate from
    # mecanum_kinematics_node's cmd_vel -> wheel_rpm math below — both must
    # match the CAD-measured values (guardian_description/urdf/dimensions.xacro)
    # or dead-reckoning position will be wrong even though driving looks fine.
    wheel_radius: 0.0775
    wheel_base_length: 0.313588
    wheel_base_width: 0.390755
    cpr: 272.0  # confirmed on the real robot: 4-pole hall sensors (12 ticks/motor-rev) x 22.667:1 gearbox
    max_ticks_per_sec: 3000.0  # declared but unused in serial_bridge_node.py — not wired to anything
    sim_mode: false

mecanum_kinematics_node:
  ros__parameters:
    wheel_radius: 0.0775
    wheel_base_length: 0.313588
    wheel_base_width: 0.390755
    max_rpm: 170.0  # real motor rated max continuous speed
