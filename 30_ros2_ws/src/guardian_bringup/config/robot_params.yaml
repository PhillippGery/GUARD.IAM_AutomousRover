# Shared hardware constants — ONE place to edit. Every node below inherits
# these via ROS2's wildcard parameter matching (`/**`), so a real-world
# change (new wheels, a different motor) only ever needs changing here.
#
# Do NOT redeclare wheel_radius/wheel_base_length/wheel_base_width/max_rpm/
# max_wheel_rpm inside any node-specific block below — a node-scoped entry
# always wins over a wildcard one, so a re-added copy would silently shadow
# this block and reintroduce the exact stale-duplicate-value bug already
# found and fixed here twice (mecanum_kinematics_node and serial_bridge_node
# were independently carrying two different sets of pre-CAD placeholder
# numbers before today).
/**:
  ros__parameters:
    # CAD-measured (guardian_description/urdf/dimensions.xacro) — VEX Pro 6" mecanum wheels.
    wheel_radius: 0.0775
    wheel_base_length: 0.313588
    wheel_base_width: 0.390755
    # DCM4109 rated max continuous speed. Two keys because
    # mecanum_kinematics_node and phidget_bridge_node were written
    # independently under different names for the same real-world fact —
    # kept both here rather than renaming either node's parameter, so this
    # is still the only place either one needs editing.
    max_rpm: 170.0
    max_wheel_rpm: 170.0

serial_bridge_node:
  ros__parameters:
    serial_port_left: /dev/ttyACM0
    serial_port_right: /dev/ttyACM1
    baud_rate: 115200
    serial_timeout: 1.0
    cpr: 272.0  # confirmed on the real robot: 4-pole hall sensors (12 ticks/motor-rev) x 22.667:1 gearbox
    max_ticks_per_sec: 3000.0  # declared but unused in serial_bridge_node.py — not wired to anything
    sim_mode: false

# wheel_radius/wheel_base_length/wheel_base_width all come from the /**
# wildcard above — mecanum_kinematics_node has no parameters of its own
# beyond those.
mecanum_kinematics_node:
  ros__parameters: {}

# Owner: Vedant. Talks to the DCC1120 controllers directly over VINT via the
# Phidget22 API — drop-in replacement for serial_bridge_node (same
# /wheel_rpm in, same /odom out). wheel_radius/wheel_base_length/
# wheel_base_width/max_wheel_rpm come from the /** wildcard above.
phidget_bridge_node:
  ros__parameters:

    # ── Addressing ─────────────────────────────────────────────────────────
    # Serial of the VINT HUB. All DCC1120s report this same number; the hub
    # port is what distinguishes them.
    hub_serial: 782265

    # VINT hub port per wheel, order [FL, FR, BL, BR].
    # -1 = not wired (that wheel is skipped, node still runs) — handy for
    # bringing wheels up one at a time.
    wheel_hub_ports: [0, 5, 2, 3]

    # Per-wheel sign so +RPM drives that corner forward.
    # Left and right motors are mirror-mounted, so they take opposite signs.
    # Confirm each one empirically before trusting strafing.
    wheel_directions: [1, -1, 1, -1]

    # ── Calibration ────────────────────────────────────────────────────────
    # 60/272: 12 commutations per motor rev x 22.667 gearbox = 272 per wheel
    # rev, so the controller speaks wheel RPM. Confirmed on the real robot.
    rescale_factor: 0.220588

    # ── Limits / safety ────────────────────────────────────────────────────
    current_limit: 10.0        # A (DCC1120 floor is 5A)
    acceleration: 200.0        # wheel RPM/s
    command_timeout_sec: 0.3   # no /wheel_rpm for this long -> stop

    # ── Odometry ───────────────────────────────────────────────────────────
    publish_odom: true
    publish_tf: true           # set false if something else owns odom->base_link
    odom_rate_hz: 50.0
    odom_frame: odom
    base_frame: base_link
